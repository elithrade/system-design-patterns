# Lab 4 infrastructure: Postgres for file metadata, MinIO for the bytes.
# The app runs on the host with `dotnet run` (see README.md), so every service publishes a port.
#
#   docker compose up -d --wait
#   MinIO console: http://localhost:59001 (minio / minio-secret)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: files
      POSTGRES_PASSWORD: postgres
    ports:
      - "55732:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d files"]
      interval: 2s
      timeout: 3s
      retries: 30

  # minio/minio is no longer published on Docker Hub. This is Chainguard's build of MinIO, pinned by
  # digest because their free tier only tags :latest.
  minio:
    image: cgr.dev/chainguard/minio@sha256:f2e56aceb4d38ad9b05c901270946e2353b19f86ba4396f25cf75b15b455b38c
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
      # Stage 3: MinIO POSTs bucket events to the app on the host. The app must listen on an
      # address the container can reach (README.md, stage 3).
      MINIO_NOTIFY_WEBHOOK_ENABLE_PRIMARY: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_PRIMARY: http://host.docker.internal:5400/events/minio
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_PRIMARY: lab4-webhook-token
      # events wait here while the app is down, and are delivered when it comes back
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_PRIMARY: /data/.events
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - minio:/data
    healthcheck:
      # the image has no curl: check the port accepts connections
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
  minio:
