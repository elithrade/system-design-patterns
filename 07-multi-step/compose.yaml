# Lab 7 infrastructure: Postgres (orders and the three "services") and a Temporal dev server
# (stage 4). The app runs on the host with `dotnet run` (see README.md).
#
#   docker compose up -d --wait
#   Temporal UI: http://localhost:58233
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: shop
      POSTGRES_PASSWORD: postgres
    ports:
      - "56032:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db:/db:ro
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The Temporal CLI's dev server: one process, in-memory, with the web UI. Fine for a lab; it
  # forgets everything when the container stops.
  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "57233:7233"
      - "58233:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres:
