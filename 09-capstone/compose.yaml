# Lab 9 infrastructure: Postgres (videos, renditions, the job queue), MinIO (the bytes) and a
# Temporal dev server (stage 4). The app runs on the host with `dotnet run` (see README.md).
#
#   docker compose up -d --wait
#   MinIO console: http://localhost:59101 (minio / minio-secret)
#   Temporal UI:   http://localhost:58333
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: videos
      POSTGRES_PASSWORD: postgres
    ports:
      - "56232:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d videos"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Chainguard's build of MinIO, pinned by digest, as in lab 4.
  minio:
    image: cgr.dev/chainguard/minio@sha256:f2e56aceb4d38ad9b05c901270946e2353b19f86ba4396f25cf75b15b455b38c
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "59100:9000"
      - "59101:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The Temporal CLI's dev server, as in lab 7. It forgets everything when the container stops.
  temporal:
    image: temporalio/temporal:1.10.0
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0"]
    ports:
      - "57333:7233"
      - "58333:8233"
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  postgres:
  minio:
