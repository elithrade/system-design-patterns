# Lab 1 infrastructure: a Postgres primary, a streaming replica of it, and Redis.
# The app runs on the host with `dotnet run` (see README.md), so every service publishes a port.
#
#   docker compose up -d
#   REPLICA_DELAY=10s docker compose up -d replica   # recreate the replica with a different lag (default 2s)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: feed
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - primary:/var/lib/postgresql/data
      - ./db/primary-init:/docker-entrypoint-initdb.d:ro
      - ./db:/db:ro
    # shared_buffers is small on purpose: the dataset should not fit in memory, or every query
    # looks fast and the stages have nothing to fix
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feed"]
      interval: 2s
      timeout: 3s
      retries: 30

  # A hot standby. On first start it copies the primary with pg_basebackup, then replays the
  # primary's WAL forever. recovery_min_apply_delay holds every change back by REPLICA_DELAY, so
  # replication lag is something you can see on demand instead of a rare race.
  replica:
    image: postgres:17
    user: postgres
    environment:
      PGPASSWORD: replicator
      REPLICA_DELAY: ${REPLICA_DELAY:-2s}
    ports:
      - "55433:5432"
    volumes:
      - replica:/var/lib/postgresql/data
    command:
      - bash
      - -c
      - |
        set -e
        PGDATA=/var/lib/postgresql/data
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          until pg_basebackup -h postgres -U replicator -D "$$PGDATA" -R -X stream; do sleep 1; done
        fi
        chmod 700 "$$PGDATA"
        sed -i '/^recovery_min_apply_delay/d' "$$PGDATA/postgresql.auto.conf"
        echo "recovery_min_apply_delay = '$$REPLICA_DELAY'" >> "$$PGDATA/postgresql.auto.conf"
        exec postgres -c shared_buffers=128MB -c max_connections=200 -c hot_standby_feedback=on
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d feed"]
      interval: 2s
      timeout: 3s
      retries: 60

  # a cache, not a store: capped memory, LRU eviction, no persistence
  redis:
    image: redis:7
    command: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  primary:
  replica:
