# Lab 5 infrastructure: Postgres (data and the job queue), and nginx in front of the app with the
# 30-second read timeout most proxies and load balancers ship with.
# The app runs on the host with `dotnet run` (see README.md).
#
#   docker compose up -d --wait
#   curl localhost:5580/...   through nginx
#   curl localhost:5500/...   straight to the app
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: stride
      POSTGRES_PASSWORD: postgres
    ports:
      - "55832:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db:/db:ro
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stride"]
      interval: 2s
      timeout: 3s
      retries: 30

  # host networking, so nginx reaches the app on localhost:5500 without the app listening on
  # every interface. It listens on localhost:5580.
  nginx:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres:
