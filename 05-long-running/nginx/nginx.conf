# A reverse proxy with stock timeouts: a response that takes more than 30 s to start is cut off
# with 504 Gateway Timeout, whatever the app is still doing.
events {}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;

    upstream app {
        server 127.0.0.1:5500;
    }

    server {
        listen 127.0.0.1:5580;

        location / {
            proxy_pass http://app;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }
    }
}
