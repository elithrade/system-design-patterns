# Lab 6 infrastructure: Postgres (auctions and bids) and Redis (pub/sub between app instances).
# The app runs on the host with `dotnet run`, one or two instances (see README.md).
#
#   docker compose up -d --wait
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: auctions
      POSTGRES_PASSWORD: postgres
    ports:
      - "55932:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db:/db:ro
    command: ["postgres", "-c", "max_connections=300"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auctions"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports:
      - "56879:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres:
